name: Build icon test APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Prepare exact source icon for launcher densities
        run: |
          python -m pip install pillow
          python - <<'PY'
          from PIL import Image
          import os
          p='bechir-note-icon-original-crop(1)-2.png'
          if not os.path.isfile(p): raise SystemExit('Missing uploaded icon image in repository root')
          im=Image.open(p).convert('RGBA')
          for suffix,size in [('mdpi',48),('hdpi',72),('xhdpi',96),('xxhdpi',144),('xxxhdpi',192)]:
            folder=f'app/src/main/res/mipmap-{suffix}'
            os.makedirs(folder,exist_ok=True)
            canvas=Image.new('RGBA',(size,size),(15,7,24,255))
            inset=round(size*0.085)
            inner=size-2*inset
            scaled=im.resize((inner,inner),Image.Resampling.LANCZOS)
            canvas.alpha_composite(scaled,(inset,inset))
            canvas.save(f'{folder}/ic_launcher.png')
          # Adaptive icons: original artwork remains unchanged, placed inside safe central zone.
          for suffix,scale in [('mdpi',1),('hdpi',1.5),('xhdpi',2),('xxhdpi',3),('xxxhdpi',4)]:
            size=round(108*scale)
            folder=f'app/src/main/res/mipmap-{suffix}'
            foreground=Image.new('RGBA',(size,size),(0,0,0,0))
            # 60% central artwork fits Android's 66/108 safe region.
            inner=round(size*0.60)
            art=im.resize((inner,inner),Image.Resampling.LANCZOS)
            foreground.alpha_composite(art,((size-inner)//2,(size-inner)//2))
            foreground.save(f'{folder}/ic_foreground.png')
          os.makedirs('app/src/main/res/mipmap-anydpi-v26',exist_ok=True)
          with open('app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml','w') as out:
            out.write('<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android"><background android:drawable="@color/icon_background"/><foreground android:drawable="@mipmap/ic_foreground"/></adaptive-icon>')
          os.makedirs('app/src/main/res/values',exist_ok=True)
          with open('app/src/main/res/values/icon_colors.xml','w') as out:
            out.write('<resources><color name="icon_background">#15091E</color></resources>')
          PY
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: bechir-note-icon-test-apk
          path: app/build/outputs/apk/debug/app-debug.apk
