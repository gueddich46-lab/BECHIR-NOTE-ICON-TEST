name: Build icon test APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Prepare exact source icon for launcher densities
        run: |
          python -m pip install pillow
          python - <<'PY'
          from PIL import Image
          import os
          import glob
          candidates=glob.glob('bechir-note-borderless.png') or glob.glob('file_00000000c3fc820aae*')
          if not candidates: raise SystemExit('Missing approved borderless icon upload')
          p=candidates[0]
          print('Using approved icon file:',p)
          im=Image.open(p).convert('RGBA')
          # Keep the purple background full bleed, while pulling the notebook and
          # gold pen slightly inside the Android mask's clipping boundary.
          from PIL import ImageFilter
          for suffix,scale in [('mdpi',1),('hdpi',1.5),('xhdpi',2),('xxhdpi',3),('xxxhdpi',4)]:
            folder=f'app/src/main/res/mipmap-{suffix}'
            os.makedirs(folder,exist_ok=True)
            size=round(108*scale)
            # Extend the original purple art edge-to-edge, rather than adding black padding.
            full=im.resize((size,size),Image.Resampling.LANCZOS)
            # Move the detailed drawing inward by 5% but keep the background full-sized.
            # Blurred background fills any area around the drawing, including corners.
            backdrop=full.filter(ImageFilter.GaussianBlur(radius=max(5,round(size*.11))))
            inner=round(size*.90)
            art=im.resize((inner,inner),Image.Resampling.LANCZOS)
            offset=(size-inner)//2
            # Feather only the outside edge of the overlay to avoid a visible seam.
            mask=Image.new('L',(inner,inner),255)
            from PIL import ImageDraw
            feather=max(2,round(size*.025))
            draw=ImageDraw.Draw(mask)
            for i in range(feather):
              v=round(255*(i+1)/feather)
              draw.rectangle((i,i,inner-1-i,inner-1-i),outline=v,width=1)
            mask=mask.filter(ImageFilter.GaussianBlur(radius=max(1,feather//2)))
            backdrop.paste(art,(offset,offset),mask)
            backdrop.save(f'{folder}/ic_background.png')
            legacy=round(48*scale)
            backdrop.resize((legacy,legacy),Image.Resampling.LANCZOS).save(f'{folder}/ic_launcher.png')
          os.makedirs('app/src/main/res/mipmap-anydpi-v26',exist_ok=True)
          with open('app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml','w') as out:
            out.write('<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android"><background android:drawable="@mipmap/ic_background"/><foreground android:drawable="@color/icon_clear"/></adaptive-icon>')
          os.makedirs('app/src/main/res/values',exist_ok=True)
          with open('app/src/main/res/values/icon_colors.xml','w') as out:
            out.write('<resources><color name="icon_clear">#00000000</color></resources>')
          PY
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: bechir-note-icon-test-apk
          path: app/build/outputs/apk/debug/app-debug.apk
