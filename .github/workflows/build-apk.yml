name: Build icon test APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Prepare exact source icon for launcher densities
        run: |
          python -m pip install pillow
          python - <<'PY'
          from PIL import Image
          import os
          p='bechir-note-icon-original-crop(1)-2.png'
          if not os.path.isfile(p): raise SystemExit('Missing uploaded icon image in repository root')
          im=Image.open(p).convert('RGBA')
          for suffix,size in [('mdpi',48),('hdpi',72),('xhdpi',96),('xxhdpi',144),('xxxhdpi',192)]:
            folder=f'app/src/main/res/mipmap-{suffix}'
            os.makedirs(folder,exist_ok=True)
            im.resize((size,size),Image.Resampling.LANCZOS).save(f'{folder}/ic_launcher.png')
          PY
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: bechir-note-icon-test-apk
          path: app/build/outputs/apk/debug/app-debug.apk
